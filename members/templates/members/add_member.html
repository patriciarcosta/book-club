{% extends "members/base.html" %}

{% block title %}Add member{% endblock %}

{% block content %}
  <h1>Add a member</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'members:list' %}" class="btn btn-link">Cancel</a>
  </form>
{% endblock %}
